{% extends "layout.html" %}

{% block title %}Sign Up{% endblock %}

{% block content %}
    <h2>Sign Up</h2>
    <form method="POST" action="{{ url_for('signup') }}">
         <div>
            <label for="name">Name (Optional):</label>
            <input type="text" id="name" name="name" value="{{ form_data.name if form_data else '' }}">
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ form_data.email if form_data else '' }}" required>
        </div>
         <div>
            <label for="phone">Phone (Optional, for simulated reminders):</label>
            <input type="tel" id="phone" name="phone" value="{{ form_data.phone if form_data else '' }}" placeholder="e.g., 555-123-4567">
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div>
            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>
        <button type="submit">Sign Up</button>
    </form>
     <p style="margin-top: 1rem;">
        Already have an account? <a href="{{ url_for('login') }}">Login here</a>
    </p>
{% endblock %}
